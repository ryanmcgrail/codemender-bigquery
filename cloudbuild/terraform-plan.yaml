# Pull request check: `terraform plan` with a read-only identity.
#
# Run by the <prefix>-tf-plan trigger that terraform/bootstrap creates. Cloud
# Build runs it as the trigger's plan service account whatever this file
# says, so a pull request that edits this file still cannot apply anything or
# read secret values. The logic lives in scripts/ci/tf_plan.sh.

steps:
  - id: 'terraform-plan'
    # hashicorp/terraform:1.13.3, pinned by digest.
    name: 'hashicorp/terraform@sha256:dfb1889a8ee74ada3ddacc48f89b8a0d69f3e114de3d8a2ce15f6a8d3dbfdbe2'
    entrypoint: 'sh'
    args: ['scripts/ci/tf_plan.sh']
    env:
      - 'TF_STATE_BUCKET=${_TF_STATE_BUCKET}'
      - 'TF_STATE_PREFIX=${_TF_STATE_PREFIX}'
      - 'TF_DIR=${_TF_DIR}'

timeout: '1800s'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _TF_STATE_BUCKET: ''
  _TF_STATE_PREFIX: 'terraform/gcp'
  _TF_DIR: 'terraform/gcp'
