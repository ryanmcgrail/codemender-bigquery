# Two repositories: one with only the required key, one with every setting.
repositories:
  svc-a:
    repo_url: https://github.com/example-org/svc-a.git
  svc_b:
    repo_url: https://github.com/example-org/svc-b.git
    scan_target: "src/;lib/"
    target_branch: develop
    build_command: make test
    schedule: "30 4 * * 1"
    max_tasks: 4
    skip_verify: false
    model: example-model
    find_model: example-find-model
    verify_model: example-verify-model
    fix_model: example-fix-model
    find_flags: "--deep --deep-workers 4"
    verify_flags: ""
    fix_flags: "--example-flag"
    dry_run: true
    wiz:
      enabled: true
      min_severity: medium
