# Repositories to scan on a schedule.
#
# Copy this file to repos.yaml in the same directory and commit it. Terraform
# reads repos.yaml directly, so a pull request that edits it shows the
# resulting Cloud Scheduler changes in its plan, and merging applies them.
#
# Each entry under `repositories` becomes one Cloud Scheduler job named
# "<resource_prefix>-scan-<name>". The name may contain letters, digits, '-'
# and '_'. Renaming an entry replaces its scheduler job.
#
# Only repo_url is required. Omitted keys take the defaults shown in the
# comments. An unknown key (for example a typo), a missing repo_url, a
# malformed schedule or an unsupported wiz.min_severity fails the plan.
#
# Security: build_command runs inside the scan jobs, which hold GitHub
# credentials. Treat changes to this file like code changes and require a
# review from the team that owns the deployment (see .github/CODEOWNERS.example).

repositories:
  # Minimal entry: scanned on the default schedule (scheduler_cron) with the
  # default settings.
  example-service:
    repo_url: https://github.com/your-org/example-service.git

  # Entry showing every supported key.
  example-api:
    repo_url: https://github.com/your-org/example-api.git
    # Directory or directories to scan, separated by ';'. Default: "."
    scan_target: "src/;lib/"
    # Branch to scan. Default: "" (the repository's default branch).
    target_branch: main
    # Command CodeMender runs to build and test the code. Default: "".
    build_command: "make test"
    # Five-field cron expression, evaluated in scheduler_timezone.
    # Default: scheduler_cron from deployment.yaml.
    schedule: "0 3 * * 6"
    # Maximum parallel worker tasks. Default: 8
    max_tasks: 8
    # Skip `cm verify` before `cm fix`. Default: true
    skip_verify: true
    # Model overrides. Default: "" (the CodeMender default model). Use the
    # model names listed in the CodeMender documentation.
    # model: ""
    # find_model: ""
    # verify_model: ""
    # fix_model: ""
    # Extra cm flags per command. Flags the installed cm does not support are
    # dropped at run time with a warning. Default: ""
    find_flags: "--deep"
    verify_flags: ""
    fix_flags: ""
    # Run scan, verify and fix without any GitHub writes. Default: false
    dry_run: false
    # Opt-in Wiz SAST bridge. Default: disabled.
    # wiz:
    #   enabled: true
    #   min_severity: HIGH  # INFORMATIONAL, INFO, LOW, MEDIUM, HIGH or CRITICAL
