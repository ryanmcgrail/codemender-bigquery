# Example only: Terraform plan and apply from GitHub Actions.
#
# This file is deliberately NOT under .github/workflows/, so it never runs
# here. It is the fallback for deployments that cannot use Cloud Build (see
# docs/guides/gitops_cloud_build.md) and runs the same scripts as the Cloud
# Build pipeline: scripts/ci/tf_plan.sh and scripts/ci/tf_apply.sh.
#
# To use it:
#   1. Create a state bucket and the plan and apply service accounts, with the
#      roles terraform/bootstrap gives them (see terraform/bootstrap/iam.tf).
#      If you reuse terraform/bootstrap itself, disable its triggers so the
#      two pipelines do not both apply.
#   2. Create a Workload Identity Federation provider for this repository
#      that maps the token's environment (for example
#      attribute.environment = assertion.environment). Let any principal of
#      this repository impersonate only the plan service account, and only
#      principals with environment "terraform-apply" impersonate the apply
#      service account. Keep that split: a pull request must never get the
#      apply identity. (terraform/gha_wif scopes by repository only, so it
#      does not provide this split on its own.)
#   3. Set the repository variables below, protect the "terraform-apply"
#      environment with required reviewers if applies need an approval, and
#      copy this file to .github/workflows/terraform.yml.
#
# Repository variables:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   TF_PLAN_SERVICE_ACCOUNT         <prefix>-tf-plan@<project>.iam.gserviceaccount.com
#   TF_APPLY_SERVICE_ACCOUNT        <prefix>-tf-apply@<project>.iam.gserviceaccount.com
#   TF_STATE_BUCKET                 the bootstrap's state_bucket output
#   CI_RUNS_ON                      optional runner label (default ubuntu-latest)

name: Terraform

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_PREFIX: terraform/gcp
  TF_DIR: terraform/gcp

jobs:
  plan:
    if: github.event_name == 'pull_request'
    name: terraform plan
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_PLAN_SERVICE_ACCOUNT }}
      - run: sh scripts/ci/tf_plan.sh

  apply:
    if: github.event_name == 'push'
    name: terraform apply
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 60
    environment: terraform-apply
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_APPLY_SERVICE_ACCOUNT }}
      # Plan, destroy guard (python3 is on GitHub-hosted runners), apply.
      # There is no allow-destroy path here: an intended deletion is applied
      # by hand (see "Running Terraform by hand" in the guide).
      - run: sh scripts/ci/tf_apply.sh all
